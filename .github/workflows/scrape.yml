name: hourly-scrape
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Guard against silent no-op runs: without the DB URL the scraper would
      # fall back to an ephemeral local SQLite file and persist nothing durable.
      - name: require database secret
        run: |
          if [ -z "${{ secrets.TURSO_DATABASE_URL }}" ]; then
            echo "::error::TURSO_DATABASE_URL secret is not set. See docs/superpowers/specs/2026-06-21-turso-cutover-runbook.md"
            exit 1
          fi

      - name: scrape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: pnpm --filter @sec/scraper start

      # The dashboard is a static Vercel export that reads the DB at build time.
      # Data no longer flows through git, so trigger a rebuild explicitly to
      # reflect the latest scrape. Skipped if the deploy-hook secret is unset.
      - name: trigger dashboard rebuild
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
